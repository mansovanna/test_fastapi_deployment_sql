<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: {
            50: '#fff7ed',
            100: '#ffedd5',
            200: '#fed7aa',
            300: '#fdba74',
            400: '#fb923c',
            500: '#f97316',
            600: '#ea580c',
            700: '#c2410c',
            800: '#9a3412',
            900: '#7c2d12'
          }
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .modal-enter { animation: modalIn 0.15s ease-out; }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .backdrop-enter { animation: fadeIn 0.15s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center">
          <i data-lucide="users" class="w-4.5 h-4.5 text-white" style="width:18px;height:18px"></i>
        </div>
        <h1 class="text-base font-semibold text-gray-900">User Management</h1>
      </div>
      <button onclick="showCreateModal()"
        class="inline-flex items-center gap-1.5 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium px-3.5 py-2 rounded-lg transition-colors">
        <i data-lucide="plus" class="w-4 h-4"></i>
        Add user
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">

    <!-- Alerts -->
    <div id="alertSuccess" class="hidden mb-4 flex items-center gap-2 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-800">
      <i data-lucide="check-circle-2" class="w-4 h-4 flex-shrink-0"></i>
      <span id="successMessage"></span>
    </div>
    <div id="alertError" class="hidden mb-4 flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
      <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
      <span id="errorMessage"></span>
    </div>

    <!-- Panel -->
    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h2 class="text-sm font-semibold text-gray-900">All users</h2>
        <span id="userCount" class="text-sm text-gray-500"></span>
      </div>

      <div id="usersContainer"></div>
    </div>
  </main>

  <!-- Create/Edit Modal -->
  <div id="userModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-gray-900/40 backdrop-enter">
    <div class="modal-enter bg-white rounded-xl shadow-xl w-full max-w-md mx-4">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h2 id="modalTitle" class="text-sm font-semibold text-gray-900">Add user</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <i data-lucide="x" class="w-4.5 h-4.5" style="width:18px;height:18px"></i>
        </button>
      </div>

      <form id="userForm" onsubmit="submitForm(event)" class="px-5 py-4">
        <input type="hidden" id="userId" value="">

        <div class="mb-4">
          <label for="modalName" class="block text-sm font-medium text-gray-700 mb-1.5">Name</label>
          <input type="text" id="modalName" required placeholder="Jane Cooper"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>

        <div class="mb-5">
          <label for="modalEmail" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" id="modalEmail" required placeholder="jane@company.com"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>

        <div class="flex items-center gap-2">
          <button type="submit" id="submitBtn"
            class="flex-1 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
            Add user
          </button>
          <button type="button" onclick="closeModal()"
            class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-gray-900/40 backdrop-enter">
    <div class="modal-enter bg-white rounded-xl shadow-xl w-full max-w-sm mx-4">
      <div class="px-5 pt-5">
        <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center mb-3">
          <i data-lucide="trash-2" class="w-5 h-5 text-red-600"></i>
        </div>
        <h2 class="text-sm font-semibold text-gray-900 mb-1">Delete user</h2>
        <p class="text-sm text-gray-500 mb-5">
          Are you sure you want to delete <strong id="deleteUserName" class="text-gray-700 font-medium"></strong>?
          This action can't be undone.
        </p>
      </div>
      <div class="flex items-center gap-2 px-5 pb-5">
        <button onclick="confirmDelete()"
          class="flex-1 bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          Delete
        </button>
        <button onclick="closeDeleteModal()"
          class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- View Details Modal -->
  <div id="viewModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-gray-900/40 backdrop-enter">
    <div class="modal-enter bg-white rounded-xl shadow-xl w-full max-w-sm mx-4">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h2 class="text-sm font-semibold text-gray-900">User details</h2>
        <button onclick="closeViewModal()" class="text-gray-400 hover:text-gray-600">
          <i data-lucide="x" class="w-4.5 h-4.5" style="width:18px;height:18px"></i>
        </button>
      </div>
      <div class="px-5 py-4">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-11 h-11 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center font-semibold text-sm" id="viewAvatar"></div>
          <div>
            <div id="viewName" class="text-sm font-semibold text-gray-900"></div>
            <div id="viewEmail" class="text-sm text-gray-500"></div>
          </div>
        </div>
        <div class="border-t border-gray-100 pt-3 flex items-center justify-between text-sm">
          <span class="text-gray-500">User ID</span>
          <span id="viewId" class="text-gray-700 font-medium"></span>
        </div>
      </div>
      <div class="px-5 pb-5">
        <button onclick="closeViewModal()"
          class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          Close
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let currentUsers = [];
    let deleteTargetId = null;
    const API_URL = '/api';

    document.addEventListener('DOMContentLoaded', refreshUsers);

    async function refreshUsers() {
      try {
        const response = await fetch(`${API_URL}/users/`);
        if (response.ok) {
          currentUsers = await response.json();
          renderUsers(currentUsers);
          hideAlert('error');
        } else {
          showError('Failed to fetch users');
        }
      } catch (error) {
        console.error(error);
        showError('An error occurred while fetching users');
      }
    }

    function initials(name) {
      return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    }

    function renderUsers(users) {
      const container = document.getElementById('usersContainer');
      const userCount = document.getElementById('userCount');

      if (!users || users.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 px-6 text-center">
            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mb-3">
              <i data-lucide="users" class="w-5 h-5 text-gray-400"></i>
            </div>
            <p class="text-sm font-medium text-gray-700 mb-1">No users yet</p>
            <p class="text-sm text-gray-500 mb-4">Add your first user to get started.</p>
            <button onclick="showCreateModal()"
              class="inline-flex items-center gap-1.5 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium px-3.5 py-2 rounded-lg transition-colors">
              <i data-lucide="plus" class="w-4 h-4"></i>
              Add user
            </button>
          </div>
        `;
        userCount.textContent = '0 users';
        lucide.createIcons();
        return;
      }

      let rows = '';
      users.forEach(user => {
        rows += `
          <tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50/60 transition-colors">
            <td class="px-5 py-3">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center text-xs font-semibold flex-shrink-0">
                  ${initials(escapeHtml(user.name))}
                </div>
                <span class="text-sm font-medium text-gray-900">${escapeHtml(user.name)}</span>
              </div>
            </td>
            <td class="px-5 py-3 text-sm text-gray-500">${escapeHtml(user.email)}</td>
            <td class="px-5 py-3 text-sm text-gray-400">#${user.id}</td>
            <td class="px-5 py-3">
              <div class="flex items-center justify-end gap-1">
                <button onclick="viewUser(${user.id})" title="View"
                  class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-primary-600 hover:bg-primary-50 transition-colors">
                  <i data-lucide="eye" class="w-4 h-4"></i>
                </button>
                <button onclick="showEditModal(${user.id})" title="Edit"
                  class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-primary-600 hover:bg-primary-50 transition-colors">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button onclick="showDeleteModal(${user.id})" title="Delete"
                  class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-colors">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      });

      container.innerHTML = `
        <table class="w-full">
          <thead>
            <tr class="border-b border-gray-100">
              <th class="text-left px-5 py-2.5 text-xs font-medium text-gray-500 uppercase tracking-wide">Name</th>
              <th class="text-left px-5 py-2.5 text-xs font-medium text-gray-500 uppercase tracking-wide">Email</th>
              <th class="text-left px-5 py-2.5 text-xs font-medium text-gray-500 uppercase tracking-wide">ID</th>
              <th class="px-5 py-2.5"></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      userCount.textContent = `${users.length} user${users.length > 1 ? 's' : ''}`;
      lucide.createIcons();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showCreateModal() {
      document.getElementById('modalTitle').textContent = 'Add user';
      document.getElementById('submitBtn').textContent = 'Add user';
      document.getElementById('userId').value = '';
      document.getElementById('modalName').value = '';
      document.getElementById('modalEmail').value = '';
      openModal('userModal');
      hideAlert('error');
    }

    async function showEditModal(userId) {
      try {
        const response = await fetch(`${API_URL}/users/${userId}`);
        if (response.ok) {
          const user = await response.json();
          document.getElementById('modalTitle').textContent = 'Edit user';
          document.getElementById('submitBtn').textContent = 'Save changes';
          document.getElementById('userId').value = user.id;
          document.getElementById('modalName').value = user.name;
          document.getElementById('modalEmail').value = user.email;
          openModal('userModal');
          hideAlert('error');
        } else {
          showError('Failed to fetch user details');
        }
      } catch (error) {
        console.error(error);
        showError('An error occurred');
      }
    }

    async function submitForm(event) {
      event.preventDefault();
      const userId = document.getElementById('userId').value;
      const name = document.getElementById('modalName').value.trim();
      const email = document.getElementById('modalEmail').value.trim();

      if (!name || !email) {
        showError('Please fill in all fields');
        return;
      }

      const userData = { name, email };

      try {
        let response, successMessage;
        if (userId) {
          response = await fetch(`${API_URL}/users/${userId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
          });
          successMessage = 'User updated';
        } else {
          response = await fetch(`${API_URL}/users/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
          });
          successMessage = 'User added';
        }

        if (response.ok) {
          closeModal();
          showSuccess(successMessage);
          refreshUsers();
        } else {
          const error = await response.json();
          showError(error.detail || 'Operation failed');
        }
      } catch (error) {
        console.error(error);
        showError('An error occurred');
      }
    }

    function showDeleteModal(userId) {
      deleteTargetId = userId;
      const user = currentUsers.find(u => u.id === userId);
      if (user) {
        document.getElementById('deleteUserName').textContent = user.name;
        openModal('deleteModal');
      }
    }

    async function confirmDelete() {
      if (!deleteTargetId) return;
      try {
        const response = await fetch(`${API_URL}/users/${deleteTargetId}`, { method: 'DELETE' });
        if (response.ok) {
          closeDeleteModal();
          showSuccess('User deleted');
          refreshUsers();
        } else {
          const error = await response.json();
          showError(error.detail || 'Failed to delete user');
        }
      } catch (error) {
        console.error(error);
        showError('An error occurred');
      }
    }

    async function viewUser(userId) {
      try {
        const response = await fetch(`${API_URL}/users/${userId}`);
        if (response.ok) {
          const user = await response.json();
          document.getElementById('viewAvatar').textContent = initials(user.name);
          document.getElementById('viewId').textContent = `#${user.id}`;
          document.getElementById('viewName').textContent = user.name;
          document.getElementById('viewEmail').textContent = user.email;
          openModal('viewModal');
        } else {
          showError('Failed to fetch user details');
        }
      } catch (error) {
        console.error(error);
        showError('An error occurred');
      }
    }

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }
    function closeEl(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function closeModal() { closeEl('userModal'); }
    function closeDeleteModal() { closeEl('deleteModal'); deleteTargetId = null; }
    function closeViewModal() { closeEl('viewModal'); }

    window.onclick = function(event) {
      ['userModal', 'deleteModal', 'viewModal'].forEach(id => {
        if (event.target === document.getElementById(id)) closeEl(id);
      });
    };

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeModal();
        closeDeleteModal();
        closeViewModal();
      }
    });

    function showSuccess(message) {
      const alert = document.getElementById('alertSuccess');
      document.getElementById('successMessage').textContent = message;
      alert.classList.remove('hidden');
      setTimeout(() => alert.classList.add('hidden'), 4000);
    }

    function showError(message) {
      const alert = document.getElementById('alertError');
      document.getElementById('errorMessage').textContent = message;
      alert.classList.remove('hidden');
      setTimeout(() => alert.classList.add('hidden'), 4000);
    }

    function hideAlert(type) {
      document.getElementById(type === 'error' ? 'alertError' : 'alertSuccess').classList.add('hidden');
    }
  </script>
</body>
</html>
